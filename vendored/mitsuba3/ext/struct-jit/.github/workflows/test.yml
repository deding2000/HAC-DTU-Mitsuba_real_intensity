name: Tests

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        name: Install Python
        with:
          python-version: '3.13'

      - name: Build and install the Python package
        run: python -m pip install --verbose ".[disasm]" pytest

      - name: Run the Python test suite
        working-directory: tests
        run: python -m pytest -v .

      - name: Configure the C++ tests
        run: cmake -S . -B build-cpp -DSJIT_ENABLE_PYTHON=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build the C++ tests
        run: cmake --build build-cpp --config Release -j

      - name: Run the C++ tests
        run: ctest --test-dir build-cpp --build-config Release --output-on-failure
